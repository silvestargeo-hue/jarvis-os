name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: builds/jarvis-os

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: builds/jarvis-os/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Convex client (convex/_generated is gitignored)
        run: pnpm exec convex codegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests (crypto, chunker)
        run: pnpm exec vitest run tests/

      - name: Build (backend URL stubbed — pages gate themselves)
        run: |
          cp .env.example .env.local 2>/dev/null || true
          pnpm exec next build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-stub.convex.cloud

      - name: Backend probe (optional; skipped without CONVEX_DEPLOY_KEY)
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then echo "skip: CONVEX_DEPLOY_KEY not set"; exit 0; fi
          node scripts/e2e-probe.mjs "$CONVEX_PROBE_URL"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_PROBE_URL: ${{ secrets.CONVEX_PROBE_URL }}
        continue-on-error: true

  deploy:
    name: Deploy (Convex + Vercel)
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: builds/jarvis-os/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: the `secrets` context is not available inside `if:` conditions on
      # GitHub Actions — guard at runtime in the shell instead.
      - name: Deploy Convex functions
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then echo "skip: CONVEX_DEPLOY_KEY not set"; exit 0; fi
          npx convex deploy --preview-name production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy to Vercel (pull-through CLI)
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "skip: VERCEL_TOKEN not set"; exit 0; fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
